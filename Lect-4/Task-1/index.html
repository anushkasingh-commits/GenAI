<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tree Chatbot</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Full-screen Three.js canvas background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* Centered layout container */
        .chat-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Glassmorphism chat box */
        .chat-box {
            width: 450px;
            height: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Message styling with fade-in animation */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #fff;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: rgba(0, 123, 255, 0.6);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background: rgba(255, 255, 255, 0.2);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* Thinking animation (three bouncing dots) */
        .thinking-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            align-self: flex-start;
            animation: fadeIn 0.4s ease-in-out;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Chat input area */
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .chat-input-area button {
            padding: 0 20px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Three.js 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Chat UI Container -->
    <div class="chat-container">
        <div class="chat-box">
            <div class="chat-header">DSA Trees Chatbot</div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">Hello! Ask me anything about Tree Data Structures.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Three.js Animated 3D Background (Floating Particles / Nodes) ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create particles representing tree nodes
        const particleCount = 400;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 50;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0x007bff, size: 0.4, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 20;

        // Animate background rotation
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += 0.0005;
            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // --- 2. Chatbot Interaction Logic ---
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function handleSendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            // Append user message
            appendMessage(question, 'user-message');
            userInput.value = '';

            // Show thinking animation
            const thinkingId = showThinkingIndicator();
            scrollToBottom();

            try {
                // Send POST request to FastAPI backend
                const response = await fetch('http://localhost:8000/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch response from server.');
                }

                const data = await response.json();
                
                // Remove thinking indicator
                removeThinkingIndicator(thinkingId);

                // Append bot reply
                appendMessage(data.answer, 'bot-message');

            } catch (error) {
                removeThinkingIndicator(thinkingId);
                appendMessage("Error: Could not connect to the backend server.", 'bot-message');
            }

            scrollToBottom();
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
        }

        function showThinkingIndicator() {
            const id = 'thinking-' + Date.now();
            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'thinking-indicator';
            indicatorDiv.id = id;
            indicatorDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatMessages.appendChild(indicatorDiv);
            return id;
        }

        function removeThinkingIndicator(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Event listeners
        // Event listeners with preventDefault to stop page refreshes
        sendBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handleSendMessage();
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
